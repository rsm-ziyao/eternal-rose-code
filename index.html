<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080711" />
    <meta name="description" content="一束永不凋零、会持续旋转盛放的粒子玫瑰。" />
    <title>永不凋零的玫瑰花束</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <div class="grain" aria-hidden="true"></div>
      <section class="bouquet-wrap" aria-label="粒子玫瑰动画">
        <div class="halo halo-one"></div><div class="halo halo-two"></div>
        <canvas id="bouquet" aria-label="一束正在盛放的粒子玫瑰"></canvas>
        <div class="caption"><span>LIVE PARTICLE GARDEN</span><span id="paletteName">BLUSH ROSE</span></div>
      </section>

      <nav class="controls" aria-label="花束控制">
        <button id="bloom" type="button"><span>↺</span> 重新盛开</button>
        <button id="palette" type="button"><span>◌</span> 换一种颜色</button>
        <button id="share" class="share" type="button"><span>↗</span> 分享这束花</button>
      </nav>
      <footer><span>FOR YOU, ALWAYS.</span><span>∞ NEVER WITHER</span></footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
